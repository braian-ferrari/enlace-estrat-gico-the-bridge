<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ecosistemas de Intervención — mapa interactivo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
  :root{ --bg:#0b1130; --bg2:#0d1638; --gold:#c9a227; --gold-light:#e8c873;
         --text:#eef0f6; --text-dim:#8d94b8; }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);}
  body{font-family:'Poppins',sans-serif;color:var(--text);}
  #app{display:flex; width:100%; height:100%;}

  #sidebar{width:min(330px,86vw); flex:none; height:100%; background:#0a0f28; border-right:1px solid rgba(255,255,255,.07);
    overflow-y:auto; padding:calc(20px + env(safe-area-inset-top,0px)) 0 20px; transition:transform .3s ease;}
  .sb-header{padding:0 20px 18px; border-bottom:1px solid rgba(255,255,255,.07); margin-bottom:6px;}
  .sb-header .ie{font-family:'Playfair Display',serif; font-style:italic; font-weight:600; font-size:22px; color:var(--gold-light);}
  .sb-header .sub{font-size:9.5px; letter-spacing:2px; color:var(--text-dim); margin-top:2px;}
  .nav-title{font-size:10px; letter-spacing:1.8px; color:var(--text-dim); font-weight:600; padding:16px 20px 6px;}
  .navrow{display:flex; align-items:center; gap:10px; padding:12px 20px;
    border-bottom:1px solid rgba(255,255,255,.06); cursor:pointer; border-left:3px solid transparent;}
  .navrow:hover{background:rgba(255,255,255,.03);}
  .navrow .dot{width:8px;height:8px;border-radius:50%;flex:none;opacity:.9;}
  .navrow .t{font-size:12.3px; font-weight:600; line-height:1.4; color:var(--text); flex:1;}
  .navrow .chev{color:var(--text-dim); font-size:14px; flex:none;}
  .navrow.subrow{padding-left:36px;}
  .navrow.subrow .t{font-weight:400; font-size:11.2px; color:#c3c8e0;}
  .navrow.quoterow .t{font-style:italic;}
  .navrow.active{background:rgba(255,255,255,.06);}
  .navrow.active .t{color:#fff;}

  #main{position:relative; flex:1; min-width:0; height:100%;
    background:radial-gradient(ellipse at 58% 40%, var(--bg2), var(--bg) 75%);}
  #canvas{width:100%;height:100%;display:block;cursor:grab;}
  #canvas:active{cursor:grabbing;}
  #vignette{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at 50% 50%, transparent 55%, rgba(2,4,10,.6) 100%); z-index:1;}

  #toolbar{position:absolute; top:calc(16px + env(safe-area-inset-top,0px)); right:16px;
    display:flex; align-items:center; gap:10px; z-index:5;}
  #search{width:180px; background:rgba(10,16,40,.75); border:1px solid rgba(201,162,39,.35);
    color:var(--text); font-family:'Poppins',sans-serif; font-size:12px;
    padding:9px 12px; border-radius:8px; outline:none; backdrop-filter:blur(6px);}
  #search::placeholder{color:var(--text-dim);}
  #search:focus{border-color:var(--gold);}
  .btn{background:rgba(10,16,40,.75); border:1px solid rgba(255,255,255,.2); color:var(--text);
    font-family:'Poppins',sans-serif; font-size:11px; font-weight:500;
    padding:9px 13px; border-radius:8px; cursor:pointer; backdrop-filter:blur(6px); white-space:nowrap;}
  .btn:hover{background:rgba(201,162,39,.12);}
  .btn.active{border-color:var(--gold); color:var(--gold-light);}
  #menuBtn{display:none;}
  #scrim{display:none;}
  @media (max-width:820px){
    #sidebar{position:fixed; left:0; top:0; z-index:20; transform:translateX(-100%); box-shadow:20px 0 40px rgba(0,0,0,.5);}
    #sidebar.open{transform:translateX(0);}
    #menuBtn{display:inline-flex;}
    #scrim.open{display:block; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:15;}
    #detailCard{max-width:calc(100% - 32px) !important;}
  }

  #detailCard{position:absolute; left:24px; top:calc(22px + env(safe-area-inset-top,0px)); z-index:5;
    max-width:min(560px, calc(100% - 260px)); max-height:calc(100% - 60px); overflow-y:auto;
    pointer-events:none; padding-right:8px;}
  #detailCard .inner{pointer-events:auto;}
  #placeholder{color:var(--text-dim); font-size:13px; max-width:330px; line-height:1.65;}
  .eyebrow{font-size:10.5px; letter-spacing:2.2px; font-weight:600; margin-bottom:10px;}
  #dIconWrap{width:50px;height:50px;border-radius:50%;border:1.5px solid var(--gold); background:#0e1740;
    display:flex; align-items:center; justify-content:center; margin-bottom:13px;}
  #dIconWrap svg{width:25px;height:25px;}
  #dTitle{font-family:'Playfair Display',serif; font-weight:600; font-size:clamp(20px,3vw,31px); line-height:1.22;
    color:var(--text); margin-bottom:14px; text-transform:uppercase;}
  #dTagline{font-family:'Playfair Display',serif; font-style:italic; font-size:16.5px; line-height:1.55;
    border-left:2px solid var(--gold); padding-left:15px; margin-bottom:20px;}
  .subitem{border-top:1px solid rgba(255,255,255,.1); padding:14px 0;}
  .subitem:last-child{padding-bottom:4px;}
  .subitem h4{margin:0 0 6px; font-size:11.5px; letter-spacing:1.3px; text-transform:uppercase; font-weight:600;}
  .subitem p{margin:0; font-size:12.8px; line-height:1.65; color:#c3c8e0;}
  #dCta{display:none; margin-top:20px; padding:11px 20px; border-radius:8px; border:1px solid var(--gold);
    background:rgba(201,162,39,.12); color:var(--gold-light); font-family:'Poppins',sans-serif;
    font-size:11.5px; font-weight:600; letter-spacing:.6px; cursor:pointer;}
  #dCta:hover{background:rgba(201,162,39,.25);}

  #tooltip{position:absolute; z-index:10; pointer-events:none; background:rgba(6,10,28,.96);
    border:1px solid rgba(255,255,255,.22); border-radius:8px; padding:8px 11px; font-size:11.5px;
    color:var(--text); max-width:270px; line-height:1.45; opacity:0; transform:translate(-50%,-120%);
    transition:opacity .12s ease;}
  #tooltip .tier{display:block;font-size:9px;letter-spacing:1.5px;margin-bottom:3px;text-transform:uppercase;}

  .node{transition:opacity .3s ease; opacity:1; cursor:grab;}
  .node:active{cursor:grabbing;}
  .node.dim{opacity:.1;}
  .link{transition:opacity .3s ease, stroke .3s ease, filter .3s ease; opacity:1;
    stroke:#4a5165; stroke-opacity:.38; filter:none;}
  .link.main{stroke-width:1.3;} .link.sub{stroke-width:0.9;}
  .link.mesh{stroke:#333a52; stroke-opacity:.16; stroke-width:.6;}
  .link.lit{filter:url(#glow);}
  .link.dim{opacity:.05;}

  .node .core{transition:fill .3s ease, stroke .3s ease, filter .3s ease;}
  .node:not(.hub) .core{fill:url(#grad-gray); stroke:#6b7280; stroke-width:1; filter:none;}
  .node.lit:not(.hub) .core{filter:url(#glow);}
  .node .visual{transition:transform .35s cubic-bezier(.34,1.4,.64,1);}
  .node.selected .visual{transform:scale(1.5);}
  .node.selected .core{filter:url(#glow) drop-shadow(0 0 8px #fff);}
  .icon-layer{opacity:0; transition:opacity .3s ease .05s;}
  .node.lit .icon-layer{opacity:1;}

  .glabel{color:var(--text); font:600 10.5px/1.28 'Poppins',sans-serif; text-align:center;
    pointer-events:none; user-select:none; opacity:0; transition:opacity .2s;}
  .node.pillar .glabel, .node.branchhub .glabel{opacity:1;}
  #canvas.show-labels .glabel{opacity:1;}
  .node:focus{outline:none;}
  .node:focus-visible .core{stroke:#fff !important; stroke-width:3px !important;}
  .navrow:focus-visible,.btn:focus-visible,#search:focus-visible,#dCta:focus-visible{outline:2px solid #e8b34d; outline-offset:2px;}
  #zoomCtl{position:absolute; right:16px; bottom:16px; display:flex; flex-direction:column; gap:6px; z-index:5;}
  #zoomCtl button{width:44px; height:44px; font-size:20px; line-height:1; padding:0;}
  .node.ai-rec .core{stroke:#e8b34d !important; stroke-width:3px !important;}
  .sr-only{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap;}
  #kbdHelp{position:absolute; left:16px; bottom:16px; font-size:11px; color:var(--text-dim); max-width:320px; z-index:5; pointer-events:none;}
  @media (max-width:700px){ #kbdHelp{display:none;} }
</style>
</head>
<body>
<div id="app">
  <div id="sidebar" role="navigation" aria-label="Servicios del grafo">
    <div class="sb-header"><div class="ie">IE</div><div class="sub">ECOSISTEMAS DE INTERVENCIÓN</div></div>
    <div class="nav-title">SERVICIOS</div>
    <div id="rowsPillars"></div>
    <div class="nav-title">NUESTRO ENFOQUE</div>
    <div id="rowsApproach"></div>
    <div class="nav-title">LO QUE NOS DICEN LAS EMPRESAS</div>
    <div id="rowsQuotes"></div>
  </div>

  <div id="scrim"></div>

  <div id="main">
    <div id="toolbar">
      <button class="btn" id="menuBtn" aria-label="Abrir listado de servicios" aria-controls="sidebar" aria-expanded="false">☰</button>
      <input id="search" type="search" placeholder="Buscar…" aria-label="Buscar en el grafo">
      <button class="btn" id="labelBtn" aria-pressed="false">Etiquetas</button>
      <button class="btn" id="resetBtn">Reiniciar</button>
    </div>
    <svg id="canvas" role="application" aria-label="Grafo de Ecosistemas de Intervención. Usá Tab para recorrer nodos, Enter para seleccionar, flechas para desplazar, + y − para zoom, Escape para cerrar." tabindex="0"></svg>
    <div id="zoomCtl" role="group" aria-label="Controles de zoom">
      <button class="btn" id="zoomIn" aria-label="Acercar">+</button>
      <button class="btn" id="zoomOut" aria-label="Alejar">−</button>
      <button class="btn" id="zoomFit" aria-label="Centrar vista">⤢</button>
    </div>
    <div id="kbdHelp" aria-hidden="true">Teclado: Tab recorre nodos · Enter selecciona · ←↑→↓ mueve · +/− zoom · Esc cierra</div>
    <div id="liveRegion" class="sr-only" aria-live="polite"></div>
    <div id="vignette"></div>
    <div id="detailCard" aria-live="polite" tabindex="-1">
      <div class="inner">
        <div id="placeholderWrap">
          <div id="placeholder">Seleccioná un servicio de la lista o tocá un nodo del mapa. Cada rama se enciende con su color y muestra en detalle qué aborda.</div>
        </div>
        <div id="detailBody" style="display:none;">
          <div class="eyebrow" id="dEyebrow"></div>
          <div id="dIconWrap"></div>
          <div id="dTitle"></div>
          <div id="dTagline"></div>
          <div id="dSubitems"></div>
          <button id="dCta">HABLEMOS DE TU CASO →</button>
        </div>
      </div>
    </div>
    <div id="tooltip"></div>
  </div>
</div>

// ---------- BUILD GRAPH ----------
const nodes = [{id:'hub', tier:'hub', r:40, label:'Ecosistemas de Intervención'}];
const links = [];
const meta = new Map();

services.forEach(s => {
  nodes.push({id:s.id, tier:'pillar', r:19, color:s.color, icon:s.icon, label:s.name});
  links.push({source:'hub', target:s.id, type:'main'});
  meta.set(s.id, s);
  s.items.forEach((it,i) => {
    const id = s.id+'i'+i;
    nodes.push({id, tier:'item', parent:s.id, r:10, color:s.color, label:it.t, desc:it.d});
    links.push({source:s.id, target:id, type:'sub'});
  });
});

[approach, quotes].forEach(b => {
  nodes.push({id:b.id, tier:'branchhub', r:24, color:b.color, icon:b.icon, label:b.name});
  links.push({source:'hub', target:b.id, type:'main'});
  meta.set(b.id, b);
  b.items.forEach((it,i) => {
    const id = b.id+'i'+i;
    const isQuote = b.id==='qhub';
    nodes.push({id, tier: isQuote?'quote':'item', parent:b.id, r: isQuote?9.5:10.5, color:b.color,
                label: isQuote ? it : it.t, desc: isQuote ? null : it.d});
    links.push({source:b.id, target:id, type:'sub', long:true});
  });
});

const nodeById = new Map(nodes.map(n=>[n.id,n]));
function branchColor(d){ return d.tier==='hub' ? '#eaf7ff' : d.color; }
function trunc(s,n){ return s.length>n ? s.slice(0,n-1).trim()+'…' : s; }

const centerX = W/2, centerY = H/2;
nodeById.get('hub').x = centerX; nodeById.get('hub').y = centerY;
const branchIds = [...services.map(s=>s.id), 'ahub', 'qhub'];
branchIds.forEach((id,i) => {
  const ang = (i/branchIds.length)*Math.PI*2 - Math.PI/2;
  const n = nodeById.get(id);
  n.x = centerX + Math.cos(ang)*420; n.y = centerY + Math.sin(ang)*420;
});
nodes.filter(n=>n.parent).forEach(n => {
  const p = nodeById.get(n.parent);
  n.x = p.x + (Math.random()-0.5)*110; n.y = p.y + (Math.random()-0.5)*110;
});

const neighbors = new Map(nodes.map(n=>[n.id, new Set([n.id])]));
links.forEach(l => { neighbors.get(l.source).add(l.target); neighbors.get(l.target).add(l.source); });

const meshPairs = [];
branchIds.forEach((id,i) => meshPairs.push([id, branchIds[(i+1)%branchIds.length]]));
branchIds.forEach((id,i) => { if(i%2===0) meshPairs.push([id, branchIds[(i+3)%branchIds.length]]); });
const qKids = nodes.filter(n=>n.parent==='qhub').map(n=>n.id);
qKids.forEach((id,i) => meshPairs.push([id, qKids[(i+1)%qKids.length]]));
services.forEach(s => { const k = nodes.filter(n=>n.parent===s.id).map(n=>n.id); if(k.length>1) meshPairs.push([k[0],k[1]]); });
meshPairs.push(['s1i1','s7i0'],['s4i1','s3i0'],['s6i0','s5i1'],['ahub','s7'],['qhub','s4']);
const meshLinks = meshPairs.filter(([a,b]) => nodeById.has(a) && nodeById.has(b))
  .map(([a,b]) => ({source:nodeById.get(a), target:nodeById.get(b)}));

// ---------- RENDER ----------
const svg = d3.select('#canvas').attr('viewBox', `0 0 ${W} ${H}`);
const defs = svg.append('defs');
function radial(id, stops){
  const g = defs.append('radialGradient').attr('id', id).attr('cx','35%').attr('cy','30%').attr('r','75%');
  stops.forEach(s => g.append('stop').attr('offset', s[0]).attr('stop-color', s[1]));
}
radial('hubGrad', [['0%','#1c2b52'],['55%','#0d1430'],['100%','#03060d']]);
radial('grad-gray', [['0%','#9aa1b5'],['55%','#5b6272'],['100%','#22242f']]);
const allColors = new Map();
services.forEach(s => allColors.set(s.id, s.color));
allColors.set('ahub', APPROACH_COLOR); allColors.set('qhub', QUOTE_COLOR);
allColors.forEach((c,k) => radial('lit-'+k,
  [['0%', d3.color(c).brighter(1.6).formatRgb()],['48%', c],['100%', d3.color(c).darker(1.6).formatRgb()]]));
function litGradId(d){ return 'lit-' + (d.parent || d.id); }

defs.append('filter').attr('id','glow').attr('x','-120%').attr('y','-120%').attr('width','340%').attr('height','340%')
  .html('<feGaussianBlur stdDeviation="2.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>');

const zoomLayer = svg.append('g');
const linkLayer = zoomLayer.append('g');
const nodeLayer = zoomLayer.append('g');
const zoom = d3.zoom().scaleExtent([0.25,2.6]).on('zoom', ev => zoomLayer.attr('transform', ev.transform));
svg.call(zoom);

(function particles(){
  const layer = zoomLayer.insert('g',':first-child').style('pointer-events','none');
  let seed = 123;
  const rnd = () => { seed += 0x6D2B79F5; let t = seed; t = Math.imul(t^t>>>15,t|1); t^=t+Math.imul(t^t>>>7,t|61); return ((t^t>>>14)>>>0)/4294967296; };
  const pts = d3.range(60).map(() => ({x:rnd()*W, y:rnd()*H, r:0.6+rnd()*2, op:0.07+rnd()*0.22, sx:(rnd()-0.5)*0.14, sy:(rnd()-0.5)*0.11}));
  const cs = pts.map(p => layer.append('circle').attr('cx',p.x).attr('cy',p.y).attr('r',p.r).attr('fill','#9fdcff').attr('opacity',p.op));
  (function drift(){
    pts.forEach((p,i) => {
      p.x += p.sx; p.y += p.sy;
      if(p.x<-20)p.x=W+20; if(p.x>W+20)p.x=-20; if(p.y<-20)p.y=H+20; if(p.y>H+20)p.y=-20;
      cs[i].attr('cx',p.x).attr('cy',p.y);
    });
    requestAnimationFrame(drift);
  })();
})();

const meshLinkSel = linkLayer.selectAll('line.mesh').data(meshLinks).join('line').attr('class','link mesh');
const linkSel = linkLayer.selectAll('line:not(.mesh)').data(links).join('line').attr('class', d=>'link '+d.type);

function iconPaths(kind, s){
  switch(kind){
    case 'columns': return `<line x1="-12" y1="-10" x2="-12" y2="12" stroke="${s}" stroke-width="1.6" stroke-linecap="round"/><line x1="0" y1="-10" x2="0" y2="12" stroke="${s}" stroke-width="1.6" stroke-linecap="round"/><line x1="12" y1="-10" x2="12" y2="12" stroke="${s}" stroke-width="1.6" stroke-linecap="round"/><line x1="-16" y1="12" x2="16" y2="12" stroke="${s}" stroke-width="1.6" stroke-linecap="round"/>`;
    case 'chart': return `<polyline points="-16,-14 -6,-6 2,-12 16,12" fill="none" stroke="${s}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><polyline points="8,12 16,12 16,4" fill="none" stroke="${s}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>`;
    case 'people': return `<circle cx="-8" cy="-12" r="5" fill="none" stroke="${s}" stroke-width="1.6"/><circle cx="9" cy="-12" r="5" fill="none" stroke="${s}" stroke-width="1.6"/><path d="M-19,15 Q-8,-2 3,15" fill="none" stroke="${s}" stroke-width="1.6" stroke-linecap="round"/><path d="M-2,15 Q9,-2 20,15" fill="none" stroke="${s}" stroke-width="1.6" stroke-linecap="round"/>`;
    case 'shield': return `<path d="M0,-15 L12,-10 L12,1 Q12,12 0,17 Q-12,12 -12,1 L-12,-10 Z" fill="none" stroke="${s}" stroke-width="1.5" stroke-linejoin="round"/><polyline points="-6,0 -1,6 7,-7" fill="none" stroke="${s}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>`;
    case 'orbit': return `<circle cx="0" cy="0" r="15" fill="none" stroke="${s}" stroke-width="1.5"/><circle cx="0" cy="0" r="7" fill="none" stroke="${s}" stroke-width="1.5"/>`;
    case 'gear': return `<circle cx="0" cy="0" r="7" fill="none" stroke="${s}" stroke-width="1.5"/><circle cx="0" cy="0" r="14" fill="none" stroke="${s}" stroke-width="1.5" stroke-dasharray="4 4"/>`;
    case 'dashboard': return `<path d="M-15,6 A15,15 0 0 1 15,6" fill="none" stroke="${s}" stroke-width="1.6" stroke-linecap="round"/><line x1="0" y1="6" x2="8" y2="-5" stroke="${s}" stroke-width="1.6" stroke-linecap="round"/><circle cx="0" cy="6" r="2" fill="${s}"/>`;
    case 'compass': return `<circle cx="0" cy="0" r="15" fill="none" stroke="${s}" stroke-width="1.5"/><polygon points="6,-6 -2,3 -6,6 2,-3" fill="none" stroke="${s}" stroke-width="1.5" stroke-linejoin="round"/>`;
    case 'target': return `<circle cx="0" cy="0" r="15" fill="none" stroke="${s}" stroke-width="1.5"/><circle cx="0" cy="0" r="8" fill="none" stroke="${s}" stroke-width="1.5"/><circle cx="0" cy="0" r="2" fill="${s}"/>`;
    case 'quote': return `<path d="M-12,-9 h20 a4,4 0 0 1 4,4 v6 a4,4 0 0 1 -4,4 h-13 l-6,6 v-6 h-1 a4,4 0 0 1 -4,-4 v-6 a4,4 0 0 1 4,-4 z" fill="none" stroke="${s}" stroke-width="1.5" stroke-linejoin="round"/>`;
    default: return '';
  }
}

const nodeSel = nodeLayer.selectAll('g.node').data(nodes, d=>d.id).join('g')
  .attr('class', d=>`node ${d.tier}`).attr('data-id', d=>d.id);

nodeSel.each(function(d){
  const g = d3.select(this);
  const vis = g.append('g').attr('class','visual');
  if(d.tier === 'hub'){
    vis.append('circle').attr('class','core').attr('r', d.r).attr('fill','url(#hubGrad)')
      .attr('stroke','#7e8bb5').attr('stroke-width',1);
    vis.append('image').attr('href','data:image/png;base64,'+LOGO_B64)
      .attr('x',-32).attr('y',-18.5).attr('width',64).attr('height',37).attr('preserveAspectRatio','xMidYMid meet');
  } else {
    vis.append('circle').attr('class','hitarea').attr('r', Math.max(d.r+13, 20)).attr('fill','transparent');
    vis.append('circle').attr('class','core').attr('r', d.r);
    vis.append('ellipse').attr('cx',-d.r*0.32).attr('cy',-d.r*0.35).attr('rx',d.r*0.5).attr('ry',d.r*0.32)
      .attr('fill','#ffffff').attr('opacity', d.tier==='item'||d.tier==='quote'?.14:.22);
    if(d.icon) vis.append('g').attr('class','icon-layer').html(iconPaths(d.icon,'#fff'));
    const fo = g.append('foreignObject').attr('x',-100).attr('y', d.r+5).attr('width',200).attr('height',34);
    fo.append('xhtml:div').attr('class','glabel').text(trunc(d.label, 46));
  }
});

const tooltip = d3.select('#tooltip');
function highlight(id){
  const conn = neighbors.get(id);
  nodeSel.classed('dim', n => !conn.has(n.id));
  linkSel.classed('dim', l => !(conn.has(l.source.id||l.source) && conn.has(l.target.id||l.target)));
}
function clearHighlight(){ nodeSel.classed('dim', false); linkSel.classed('dim', false); }
function tierName(d){
  return d.tier==='hub' ? 'Hub' : d.tier==='pillar' ? 'Servicio'
    : d.tier==='branchhub' ? 'Categoría' : d.tier==='quote' ? 'Frase frecuente' : 'Línea de trabajo';
}

nodeSel.on('mouseenter', (ev,d) => {
    highlight(d.id);
    tooltip.html(`<span class="tier" style="color:${branchColor(d)}">${tierName(d)}</span>${d.label}`).style('opacity',1);
  })
  .on('mousemove', ev => { const [x,y] = d3.pointer(ev, document.getElementById('main')); tooltip.style('left',x+'px').style('top',y+'px'); })
  .on('mouseleave', () => { tooltip.style('opacity',0); selectedId ? highlight(selectedId) : clearHighlight(); });

const drag = d3.drag()
  .on('start', (ev,d) => { if(!ev.active) sim.alphaTarget(0.2).restart(); d.fx=d.x; d.fy=d.y; })
  .on('drag', (ev,d) => { d.fx=ev.x; d.fy=ev.y; })
  .on('end', (ev,d) => { if(!ev.active) sim.alphaTarget(0); });
nodeSel.call(drag);

const sim = d3.forceSimulation(nodes)
  .force('link', d3.forceLink(links).id(d=>d.id)
    .distance(d=>d.type==='main'?340:(d.long?125:105))
    .strength(d=>d.type==='main'?0.55:(d.long?0.55:0.65)))
  .force('charge', d3.forceManyBody().strength(d=>d.tier==='hub'?-900:d.tier==='pillar'?-420:d.tier==='branchhub'?-500:-230))
  .force('collide', d3.forceCollide().radius(d=>d.r+26).strength(1))
  .force('center', d3.forceCenter(centerX, centerY))
  .alphaDecay(0.02)
  .on('tick', () => {
    linkSel.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y).attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);
    meshLinkSel.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y).attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);
    nodeSel.attr('transform', d=>`translate(${d.x},${d.y})`);
  });

function applyLit(){
  nodeSel.classed('lit', d => litSet.has(d.id));
  linkSel.classed('lit', l => litSet.has(l.target.id||l.target));
  nodeSel.select('circle.core').each(function(d){
    if(d.tier==='hub') return;
    const on = litSet.has(d.id);
    d3.select(this).style('fill', on ? `url(#${litGradId(d)})` : null)
      .style('stroke', on ? d3.color(branchColor(d)).brighter(0.8).formatRgb() : null);
  });
  linkSel.each(function(l){
    const tgt = l.target.id ? l.target : nodeById.get(l.target);
    const on = litSet.has(tgt.id);
    d3.select(this).style('stroke', on ? branchColor(tgt) : null).style('stroke-opacity', on ? .75 : null);
  });
}

// ---------- SIDEBAR ----------
function addRow(container, id, label, color, isSub, isQuote){
  const row = container.append('div')
    .attr('class', 'navrow' + (isSub?' subrow':'') + (isQuote?' quoterow':''))
    .attr('data-id', id)
    .on('click', () => { chooseNode(id); closeSidebar(); })
    .on('mouseenter', () => highlight(id))
    .on('mouseleave', () => { selectedId ? highlight(selectedId) : clearHighlight(); });
  row.append('span').attr('class','dot').style('background', color)
    .style('width', isSub?'6px':'8px').style('height', isSub?'6px':'8px');
  row.append('div').attr('class','t').text(isQuote ? '“'+trunc(label,42)+'”' : label);
  row.append('div').attr('class','chev').text('›');
}
const rowsPillars = d3.select('#rowsPillars');
services.forEach(s => {
  addRow(rowsPillars, s.id, s.name, s.color, false, false);
  s.items.forEach((it,i) => addRow(rowsPillars, s.id+'i'+i, it.t, s.color, true, false));
});
const rowsApproach = d3.select('#rowsApproach');
addRow(rowsApproach, 'ahub', approach.name, approach.color, false, false);
approach.items.forEach((it,i) => addRow(rowsApproach, 'ahub'+'i'+i, it.t, approach.color, true, false));
const rowsQuotes = d3.select('#rowsQuotes');
addRow(rowsQuotes, 'qhub', quotes.name, quotes.color, false, false);
quotes.items.forEach((it,i) => addRow(rowsQuotes, 'qhub'+'i'+i, it, quotes.color, true, true));

// ---------- DETAIL ----------
const placeholderWrap = d3.select('#placeholderWrap'), detailBody = d3.select('#detailBody');
const dEyebrow = d3.select('#dEyebrow'), dIconWrap = d3.select('#dIconWrap'), dTitle = d3.select('#dTitle'),
      dTagline = d3.select('#dTagline'), dSubitems = d3.select('#dSubitems'), dCta = d3.select('#dCta');

function panTo(x,y,scale){
  svg.transition().duration(650).call(zoom.transform, d3.zoomIdentity.translate(W/2-x*scale, H/2-y*scale).scale(scale));
}
function chooseNode(id){ litSet.add(id); applyLit(); selectNode(id); }

function selectNode(id){
  const d = nodeById.get(id);
  if(d.tier === 'hub'){ deselect(); return; }
  selectedId = id;
  nodeSel.classed('selected', n => n.id === id);
  nodeSel.filter(n => n.id === id).raise();
  highlight(id);
  panTo(d.x, d.y, d.tier==='pillar'||d.tier==='branchhub' ? 1.45 : 1.75);

  const col = branchColor(d);
  d3.selectAll('.navrow').each(function(){
    const on = this.getAttribute('data-id') === id;
    d3.select(this).classed('active', on).style('border-left-color', on ? col : null);
  });

  placeholderWrap.style('display','none'); detailBody.style('display','block');
  document.getElementById('detailCard').scrollTop = 0;
  dEyebrow.style('color', col);
  dTagline.style('border-left-color', col).style('color', d3.color(col).brighter(0.7).formatRgb());
  dCta.style('display','block').style('border-color', col).style('color', d3.color(col).brighter(0.9).formatRgb());
  dSubitems.selectAll('*').remove();

  const parentMeta = d.parent ? meta.get(d.parent) : meta.get(d.id);
  const icon = d.icon || (parentMeta && parentMeta.icon);
  dIconWrap.style('border-color', col).html(`<svg viewBox="-20 -20 40 40">${iconPaths(icon, col)}</svg>`);

  if(d.tier === 'pillar' || d.tier === 'branchhub'){
    const m = meta.get(d.id);
    dEyebrow.text(d.tier==='pillar' ? 'SERVICIO SELECCIONADO' : 'CATEGORÍA');
    dTitle.style('display','block').text(m.name);
    dTagline.style('display','block').text(m.tagline);
    if(d.id === 'qhub'){
      m.items.forEach(q => {
        const box = dSubitems.append('div').attr('class','subitem');
        box.append('p').style('font-style','italic').style('color', d3.color(col).brighter(0.8).formatRgb()).text('“'+q+'”');
      });
    } else {
      m.items.forEach(it => {
        const box = dSubitems.append('div').attr('class','subitem');
        box.append('h4').style('color', col).text(it.t);
        box.append('p').text(it.d);
      });
    }
  } else if(d.tier === 'quote'){
    dEyebrow.text('LO QUE NOS DICEN LAS EMPRESAS');
    dTitle.style('display','none');
    dTagline.style('display','block').style('font-size','21px').text('“'+d.label+'”');
  } else {
    dEyebrow.text((parentMeta ? parentMeta.name.toUpperCase() : 'LÍNEA DE TRABAJO'));
    dTitle.style('display','block').text(d.label);
    dTagline.style('display','none');
    const box = dSubitems.append('div').attr('class','subitem');
    box.append('p').text(d.desc || '');
  }
  if(d.tier !== 'quote') dTagline.style('font-size',null);
}

function deselect(){
  selectedId = null;
  nodeSel.classed('selected', false);
  clearHighlight();
  d3.selectAll('.navrow').classed('active', false).style('border-left-color', null);
  placeholderWrap.style('display','block'); detailBody.style('display','none');
  svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity);
}
svg.on('click', () => { if(selectedId) deselect(); });
nodeSel.on('click', (ev,d) => { ev.stopPropagation(); chooseNode(d.id); });
dCta.on('click', () => { window.open('https://enlaceestrategicoar.com.ar/contacto', '_blank'); });

document.getElementById('search').addEventListener('input', ev => {
  const q = ev.target.value.trim().toLowerCase();
  if(!q){ nodeSel.classed('dim', false); selectedId ? highlight(selectedId) : clearHighlight(); return; }
  nodeSel.each(function(d){
    const hit = d.tier!=='hub' && ((d.label+' '+(d.desc||'')).toLowerCase().includes(q));
    d3.select(this).classed('dim', !hit);
  });
});

const menuBtn = document.getElementById('menuBtn'), sidebarEl = document.getElementById('sidebar'), scrimEl = document.getElementById('scrim');
function closeSidebar(){ sidebarEl.classList.remove('open'); scrimEl.classList.remove('open'); }
menuBtn.addEventListener('click', () => { sidebarEl.classList.toggle('open'); scrimEl.classList.toggle('open'); });
scrimEl.addEventListener('click', closeSidebar);

document.getElementById('labelBtn').addEventListener('click', function(){
  const on = svg.classed('show-labels', !svg.classed('show-labels'));
  d3.select(this).classed('active', on);
});
document.getElementById('resetBtn').addEventListener('click', () => {
  document.getElementById('search').value = '';
  deselect(); litSet.clear(); applyLit();
  nodes.forEach(n => { delete n.fx; delete n.fy; });
  sim.alpha(0.8).restart();
});


// ---------- ACCESIBILIDAD: TECLADO + TÁCTIL ----------
nodeSel.attr('tabindex', d => d.tier==='hub' ? -1 : 0).attr('role','button')
  .attr('aria-label', d => tierName(d)+': '+d.label)
  .on('focus', (ev,d) => highlight(d.id))
  .on('blur', () => { selectedId ? highlight(selectedId) : clearHighlight(); })
  .on('keydown', (ev,d) => {
    if(ev.key==='Enter' || ev.key===' '){ ev.preventDefault(); ev.stopPropagation(); chooseNode(d.id); announce(d); }
  });
d3.selectAll('.navrow').attr('tabindex',0).attr('role','button')
  .on('keydown', function(ev){ if(ev.key==='Enter'||ev.key===' '){ ev.preventDefault(); const id=this.getAttribute('data-id'); chooseNode(id); closeSidebar(); announce(nodeById.get(id)); } });
function announce(d){ if(d) document.getElementById('liveRegion').textContent = tierName(d)+' seleccionado: '+d.label; }
function zoomBy(k){ svg.transition().duration(250).call(zoom.scaleBy, k); }
function panBy(dx,dy){ svg.transition().duration(150).call(zoom.translateBy, dx, dy); }
document.getElementById('zoomIn').addEventListener('click', ev => { ev.stopPropagation(); zoomBy(1.3); });
document.getElementById('zoomOut').addEventListener('click', ev => { ev.stopPropagation(); zoomBy(1/1.3); });
document.getElementById('zoomFit').addEventListener('click', ev => { ev.stopPropagation(); svg.transition().duration(400).call(zoom.transform, d3.zoomIdentity); });
document.addEventListener('keydown', ev => {
  const t = ev.target; if(t && (t.tagName==='INPUT' || t.tagName==='TEXTAREA')) { if(ev.key==='Escape') t.blur(); return; }
  const step = 80;
  switch(ev.key){
    case 'ArrowLeft': panBy(step,0); break;
    case 'ArrowRight': panBy(-step,0); break;
    case 'ArrowUp': panBy(0,step); break;
    case 'ArrowDown': panBy(0,-step); break;
    case '+': case '=': zoomBy(1.3); break;
    case '-': case '_': zoomBy(1/1.3); break;
    case 'Escape': deselect(); closeSidebar(); break;
    default: return;
  }
  ev.preventDefault();
});
// Táctil: tap en nodo ya funciona vía click; evitar que el scroll de la página compita con el gesto.
svg.style('touch-action','none');
menuBtn.addEventListener('click', () => menuBtn.setAttribute('aria-expanded', sidebarEl.classList.contains('open')));
document.getElementById('labelBtn').addEventListener('click', function(){ this.setAttribute('aria-pressed', svg.classed('show-labels')); });

// ---------- PUENTE CON LA PÁGINA (recomendaciones IA) ----------
window.addEventListener('message', ev => {
  if(ev.origin !== window.location.origin) return;
  const m = ev.data || {};
  if(m.type === 'ee-recommend' && Array.isArray(m.ids)){
    const ids = m.ids.filter(id => nodeById.has(id));
    nodeSel.classed('ai-rec', n => ids.includes(n.id));
    litSet.clear(); ids.forEach(id => { litSet.add(id); const p = nodeById.get(id).parent; if(p) litSet.add(p); }); applyLit();
    if(ids[0]) selectNode(ids[0]);
  } else if(m.type === 'ee-select' && nodeById.has(m.id)){
    chooseNode(m.id);
  } else if(m.type === 'ee-clear'){
    nodeSel.classed('ai-rec', false); deselect(); litSet.clear(); applyLit();
  }
});
applyLit();
(function intro(){
  branchIds.forEach((id,i) => setTimeout(() => { litSet.add(id); applyLit(); }, 200*(i+1)));
  setTimeout(() => { if(!selectedId){ litSet.clear(); applyLit(); } }, 200*branchIds.length + 1600);
})();
</script>
